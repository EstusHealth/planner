<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Weekly planner</title>
<script>try{const t=localStorage.getItem("weekly-planner-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f4f2; --paper:#ffffff; --line:#c9ccc8; --ink:#262a27; --muted:#6b716c;
  --side:#f1f3f0; --sage:#e3efe4; --sage-ink:#2f6a3c; --hover:#eef5ef; --shadow:rgba(0,0,0,.14);
  --c1:#e3efe4; --c1i:#2f6a3c;
  --c2:#e4ecf5; --c2i:#2c4f7a;
  --c3:#f6ecdd; --c3i:#7a5320;
  --c4:#efe6f3; --c4i:#5e3a72;
  --c5:#f5e3e3; --c5i:#7c2f2f;
  --c6:#ececec; --c6i:#444;
}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171a18; --paper:#1f2320; --line:#3a403b; --ink:#e7eae7; --muted:#9aa29c;
    --side:#252a26; --sage:#26392a; --sage-ink:#9fd3aa; --hover:#26302a; --shadow:rgba(0,0,0,.45);
    --c1:#26392a; --c1i:#9fd3aa; --c2:#232f3d; --c2i:#9ec0e6;
    --c3:#3a2f20; --c3i:#e3bf8a; --c4:#33283a; --c4i:#cfaee0;
    --c5:#3b2626; --c5i:#e8a6a6; --c6:#2c2c2c; --c6i:#cfcfcf;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171a18; --paper:#1f2320; --line:#3a403b; --ink:#e7eae7; --muted:#9aa29c;
  --side:#252a26; --sage:#26392a; --sage-ink:#9fd3aa; --hover:#26302a; --shadow:rgba(0,0,0,.45);
  --c1:#26392a; --c1i:#9fd3aa; --c2:#232f3d; --c2i:#9ec0e6;
  --c3:#3a2f20; --c3i:#e3bf8a; --c4:#33283a; --c4i:#cfaee0;
  --c5:#3b2626; --c5i:#e8a6a6; --c6:#2c2c2c; --c6i:#cfcfcf;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,Arial,Helvetica,sans-serif;font-size:15px;line-height:1.4;transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.sheet{background:var(--paper);border:1px solid var(--line)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.week{display:flex;align-items:center;gap:8px;font-size:20px;color:var(--muted);letter-spacing:.02em}
.week input{border:0;border-bottom:1px solid var(--line);background:transparent;font-size:17px;padding:2px 4px;color:var(--ink)}
.hint{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default;background:var(--paper)}
.btn.icon{padding:6px 8px}
.btn svg{width:16px;height:16px;flex:none}

/* export menu */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px var(--shadow);padding:4px;z-index:40}
.menu button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu small{color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* tray */
.tray{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);min-height:58px}
.tray-label{font-size:13px;color:var(--muted);margin-right:4px}
.tray.drop-bin{background:var(--c5)}
.tray.drop-bin .tray-label::after{content:" · drop here to remove"}
.place-hint{font-size:13px;color:var(--sage-ink);font-weight:500}
.place-hint:empty{display:none}
.add{display:flex;gap:6px;align-items:center;margin-left:auto}
.add input{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;width:150px;font-size:14px}
.swatches{display:flex;gap:4px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}

/* blocks */
.chip,.block{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border-radius:6px}
.chip{padding:5px 10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:1px}
.chip .x{opacity:0;border:0;background:none;cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.chip:hover .x,.chip:focus-within .x{opacity:.6}
.block{padding:6px 8px;margin-bottom:6px;position:relative}
.block .t{font-weight:600;font-size:15px;outline:none;display:block;padding-right:18px;word-break:break-word}
.block .s{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:4px;margin-top:2px}
.block .s input{border:0;border-bottom:1px solid currentColor;background:transparent;width:64px;font-size:12.5px;padding:0;color:inherit}
.block .s input::placeholder{color:inherit;opacity:.5}
.block .del{position:absolute;top:4px;right:4px;border:0;background:none;cursor:pointer;opacity:0;font-size:14px;line-height:1;color:inherit}
.block:hover .del,.block:focus-within .del{opacity:.6}
.block .pin{border:0;background:none;cursor:pointer;padding:0;font-size:12px;color:inherit;opacity:.55;text-decoration:underline dotted}
.block.anchor .pin{opacity:1;text-decoration:none;font-weight:600}
.k1{background:var(--c1);color:var(--c1i)} .k2{background:var(--c2);color:var(--c2i)}
.k3{background:var(--c3);color:var(--c3i)} .k4{background:var(--c4);color:var(--c4i)}
.k5{background:var(--c5);color:var(--c5i)} .k6{background:var(--c6);color:var(--c6i)}
.block.anchor{box-shadow:inset 3px 0 0 currentColor}

/* transitions */
.chip.tchip{background:transparent;border:1px dashed var(--muted);color:var(--ink)}
.chip svg,.trans svg,.gap-add svg{width:13px;height:13px;flex:none}
.trans{border:1px dashed var(--muted);border-radius:6px;margin-bottom:6px;position:relative;font-size:12.5px;color:var(--muted);background:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.trans .tr-head{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;padding:4px 22px 4px 7px;border-radius:5px;cursor:pointer}
.trans .tr-head:hover{background:var(--hover)}
.trans .tn{flex:1;font-weight:600;color:var(--ink);min-width:0;word-break:break-word}
.trans .tm{flex-basis:100%;padding-left:19px;font-size:11.5px;font-variant-numeric:tabular-nums}
.trans .tm:empty{display:none}
.trans.done{border-style:solid;border-color:var(--sage-ink);background:var(--sage)}
.trans.done .tn,.trans.done{color:var(--sage-ink)}
.trans ul{list-style:none;margin:0;padding:0 8px 6px 26px}
.trans li{padding:2px 0;color:var(--ink)}
.trans li label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.trans li input{margin:2px 0 0;accent-color:var(--sage-ink)}
.trans .del{position:absolute;top:5px;right:4px;border:0;background:none;cursor:pointer;opacity:0;font-size:14px;line-height:1;color:inherit}
.trans:hover .del,.trans:focus-within .del{opacity:.6}
.gap-add{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;border:0;background:none;color:var(--muted);font-size:11.5px;padding:0;margin:-4px 0 2px;height:16px;cursor:pointer;opacity:0;border-radius:4px}
.cell:hover .gap-add,.gap-add:focus-visible{opacity:.75}
.gap-add:hover{background:var(--hover);color:var(--sage-ink);opacity:1}
@media (hover:none){.gap-add{opacity:.55}}
.drop-line{height:3px;border-radius:2px;background:var(--sage-ink);margin:-4px 0 1px;pointer-events:none}

/* transition routine designer */
.routines{border-bottom:1px solid var(--line)}
.routines>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;cursor:pointer;list-style:none}
.routines>summary::-webkit-details-marker{display:none}
.routines>summary h2{font-size:17px;font-weight:500;margin:0;letter-spacing:.02em}
.routines .chev{width:16px;height:16px;color:var(--muted);transition:transform .15s;margin-left:auto}
.routines[open] .chev{transform:rotate(180deg)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.rcard{padding:12px 16px 16px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.rcard:last-child{border-right:0}
.rsec{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rname{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;font-weight:600;font-size:15px;padding:2px 0;margin:2px 0 6px}
.rname:hover,.rname:focus,.rsteps input:hover,.rsteps input:focus{border-bottom-color:var(--line)}
.rmins{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:8px}
.rmins input{width:52px;border:1px solid var(--line);border-radius:5px;background:var(--paper);padding:2px 6px;font-size:13px}
.rsteps{list-style:none;margin:0;padding:0;counter-reset:step}
.rsteps li{display:flex;align-items:center;gap:6px;padding:1px 0;counter-increment:step}
.rsteps li::before{content:counter(step);font-size:11px;color:var(--muted);width:14px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rsteps input{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;padding:2px 0;font-size:14px}
.xbtn{border:0;background:none;cursor:pointer;opacity:.3;color:var(--muted);font-size:14px;padding:0 2px;line-height:1}
.xbtn:hover,.xbtn:focus-visible{opacity:1}
.ractions{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:auto;padding-top:10px}
.ractions .btn{padding:4px 10px;font-size:13px}
.rused{font-size:12px;color:var(--muted)}
.rcard .linkbtn{align-self:flex-start;margin-top:6px}

/* grid */
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:120px repeat(7,minmax(128px,1fr));min-width:1020px}
.h{padding:12px 8px;text-align:center;font-size:17px;letter-spacing:.03em;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.h small{font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
.h.today{color:var(--sage-ink);font-weight:600;background:var(--sage)}
.h.today small{color:var(--sage-ink)}
.rowh{background:var(--side);padding:12px;display:flex;align-items:center;font-size:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{min-height:130px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .12s}
.grid>*:nth-child(8n){border-right:0}
.cell.over{background:var(--hover);outline:2px dashed var(--sage-ink);outline-offset:-4px}
.grid.placing .cell{cursor:copy}
.grid.placing .cell:hover{background:var(--hover)}

/* maker time + breakdown */
.insights{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;border-bottom:1px solid var(--line)}
.insights>div{padding:14px 16px 18px;min-width:0}
.insights .maker{border-right:1px solid var(--line)}
.ins-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.ins-head h2{font-size:17px;font-weight:500;margin:0;letter-spacing:.02em}
.note{font-size:13px;color:var(--muted);margin:0}
.stepper{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stepper .ctl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.stepper button{border:0;background:none;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:1;border-radius:5px}
.stepper button:hover{background:var(--hover)}
.stepper output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.maker-num{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.maker-num strong{font-size:32px;font-weight:600;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.maker-msg{margin-left:auto;font-size:13px}
.maker-msg.met{color:var(--sage-ink);font-weight:600}
.segs{display:flex;gap:3px;margin:10px 0 16px}
.seg{flex:1;height:10px;border-radius:3px;background:var(--side);border:1px solid var(--line)}
.seg.on{background:var(--sage-ink);border-color:var(--sage-ink)}
.seg.over{background:var(--sage-ink);border-color:var(--sage-ink);opacity:.5}
.mini{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px 4px;align-items:center;font-size:11px;color:var(--muted);max-width:340px}
.mini .dl{text-align:center}
.mini i{display:block;height:13px;border-radius:2px;background:transparent;border:1px solid var(--line)}
.mini i.used{background:var(--line)}
.mini i.mk{background:var(--sage-ink);border-color:var(--sage-ink)}
.mini-key{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}
.mini-key i{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--line);margin-right:4px;vertical-align:-1px}
.brows{display:grid;grid-template-columns:auto minmax(80px,max-content) 1fr 30px;gap:8px 12px;align-items:center}
.btype{padding:2px 9px;border-radius:999px;font-weight:500;font-size:13px;justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.track{height:8px;background:var(--side);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:currentColor;transition:width .2s}
.bcount{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.bcount.zero{color:var(--muted);font-weight:400}
.mk-toggle{border:1px dashed var(--line);background:transparent;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.mk-toggle:hover{border-color:var(--sage-ink);color:var(--sage-ink)}
.mk-toggle[aria-pressed="true"]{border-style:solid;background:var(--sage-ink);border-color:var(--sage-ink);color:var(--paper)}
.block .tag{margin-left:auto;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}

/* bottom */
.bottom{display:grid;grid-template-columns:repeat(3,1fr)}
.panel{padding:14px 16px 20px;border-right:1px solid var(--line)}
.panel:last-child{border-right:0}
.panel h2{font-size:17px;font-weight:500;margin:0 0 12px;letter-spacing:.02em}
.field{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.field label{white-space:nowrap}
.field input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:2px 2px}
.habits{display:grid;grid-template-columns:1fr repeat(7,26px) 38px 18px;align-items:center;row-gap:6px}
.habits .dl{text-align:center;font-size:14px}
.habits .dl.today{color:var(--sage-ink);font-weight:600}
.habits input[type=text]{border:0;border-bottom:1px solid transparent;background:transparent;padding:2px 0;min-width:0}
.habits input[type=text]:hover,.habits input[type=text]:focus{border-bottom-color:var(--line)}
.habits .cnt{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.habits .rm{border:0;background:none;cursor:pointer;opacity:.3;color:var(--muted);font-size:14px;padding:0;line-height:1}
.habits .rm:hover,.habits .rm:focus-visible{opacity:1}
.box{width:18px;height:18px;margin:0 auto;border:1px solid var(--muted);background:transparent;cursor:pointer;padding:0;display:block;border-radius:2px}
.box[aria-pressed="true"]{background:var(--sage-ink);border-color:var(--sage-ink)}
.box[aria-pressed="true"]::after{content:"";display:block;width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:translate(5px,2px) rotate(45deg)}
.linkbtn{border:0;background:none;color:var(--sage-ink);cursor:pointer;padding:0;margin-top:10px;font-size:14px}
.linkbtn:hover{text-decoration:underline}

:focus-visible{outline:2px solid var(--sage-ink);outline-offset:2px}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:rotate(-2deg)}
.ghost.copy::after{content:"+";position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--sage-ink);color:var(--paper);font-size:14px;line-height:18px;text-align:center;font-weight:600}
.dragging-src{opacity:.35}
.status{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .bottom,.insights,.rgrid{grid-template-columns:1fr}
  .rcard{border-right:0;border-bottom:1px solid var(--line)}
  .rcard:last-child{border-bottom:0}
  .panel{border-right:0;border-bottom:1px solid var(--line)}
  .insights .maker{border-right:0;border-bottom:1px solid var(--line)}
  .add{margin-left:0;width:100%}
  .add input{flex:1}
}
@media (max-width:520px){
  .menu{position:fixed;left:16px;right:16px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-width:0}
}
@media (prefers-reduced-motion:reduce){body,.cell,.fill{transition:none}.ghost{transform:none}}

@media print{
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11px}
  .wrap{padding:0;max-width:none}
  .hint,.tools,.tray,.block .del,.block:not(.anchor) .pin,.linkbtn,.gap-add,.trans .del,.routines{display:none!important}
  .habits .rm{visibility:hidden}
  .week input::-webkit-calendar-picker-indicator{display:none}
  .block .s:has(input:placeholder-shown){display:none}
  .block .s input::placeholder{color:transparent}
  .scroll{overflow:visible}
  .grid{min-width:0;grid-template-columns:90px repeat(7,1fr)}
  .h{padding:6px 4px;font-size:13px}
  .rowh{padding:8px;font-size:12px}
  .cell{min-height:92px;padding:5px;break-inside:avoid}
  .block{padding:4px 6px;margin-bottom:4px;break-inside:avoid}
  .block .t{font-size:12px;padding-right:0}
  .bottom,.insights{break-inside:avoid}
  .panel,.insights>div{padding:8px 12px}
  .stepper .ctl button{visibility:hidden}
  .mk-toggle:not([aria-pressed="true"]){visibility:hidden}
  .week input{border:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">
    <div class="top">
      <label class="week">Week of <input id="week" type="date" title="Weeks start on Monday"></label>
      <span class="hint">Anchors first, then this week's choices</span>
      <div class="tools">
        <span class="status" id="status" role="status"></span>
        <button class="btn" id="undoBtn" title="Undo (Ctrl/⌘+Z)" disabled>Undo</button>
        <button class="btn icon" id="themeBtn"></button>
        <div class="menu-wrap">
          <button class="btn" id="exportBtn" aria-haspopup="true" aria-expanded="false" aria-controls="exportMenu">Export
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu" id="exportMenu" role="menu" hidden>
            <button role="menuitem" data-x="print">Print or save as PDF</button>
            <button role="menuitem" data-x="ics">Add to calendar <small>.ics</small></button>
            <button role="menuitem" data-x="csv">Spreadsheet <small>.csv</small></button>
            <button role="menuitem" data-x="md">Markdown <small>.md</small></button>
            <button role="menuitem" data-x="copy">Copy as text</button>
            <hr role="separator">
            <button role="menuitem" data-x="json">Back up everything <small>.json</small></button>
            <button role="menuitem" data-x="import">Restore from backup…</button>
          </div>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
        <button class="btn" id="newWeek" title="Moves to the next week and clears everything except anchors">New week</button>
      </div>
    </div>

    <div class="tray" id="tray" data-drop="tray">
      <span class="tray-label" title="Drag a block onto the week, or tap it and then tap a slot">Blocks</span>
      <div id="chips" style="display:contents"></div>
      <span class="place-hint" id="placeHint"></span>
      <div class="add">
        <input id="newLabel" type="text" placeholder="New block name" aria-label="New block name">
        <div class="swatches" id="swatches"></div>
        <button class="btn" id="addBtn">Add</button>
      </div>
    </div>

    <div class="scroll"><div class="grid" id="grid"></div></div>

    <div class="insights">
      <div class="maker">
        <div class="ins-head">
          <h2>Maker time</h2>
          <div class="stepper">Target
            <span class="ctl"><button id="tDown" aria-label="Lower maker time target">−</button><output id="tVal" aria-live="polite"></output><button id="tUp" aria-label="Raise maker time target">+</button></span>
            cells
          </div>
        </div>
        <div class="maker-num"><strong id="mCount"></strong><span id="mOf"></span><span class="maker-msg" id="mMsg"></span></div>
        <div class="segs" id="segs" aria-hidden="true"></div>
        <div class="mini" id="mini" aria-hidden="true"></div>
        <div class="mini-key"><span><i style="background:var(--sage-ink);border-color:var(--sage-ink)"></i>Maker</span><span><i style="background:var(--line)"></i>Other</span><span><i></i>Free</span></div>
      </div>
      <div>
        <div class="ins-head"><h2>Breakdown</h2><span class="note" id="usedNote"></span></div>
        <div class="brows" id="brows"></div>
      </div>
    </div>

    <details class="routines" id="routines" open>
      <summary>
        <h2>Transition routines</h2>
        <span class="note">One per section · hover between blocks and tap +, or drag ↻ Transition from Blocks</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="rgrid" id="rgrid"></div>
    </details>

    <div class="bottom">
      <section class="panel">
        <h2>Work projects</h2>
        <div class="field"><label for="p0">Outcome:</label><input id="p0" data-k="projects.0"></div>
        <div class="field"><label for="p1">Next step:</label><input id="p1" data-k="projects.1"></div>
        <div class="field"><label for="p2">Next step:</label><input id="p2" data-k="projects.2"></div>
      </section>
      <section class="panel">
        <h2>Habits</h2>
        <div class="habits" id="habits"></div>
        <button class="linkbtn" id="addHabit">+ Add habit</button>
      </section>
      <section class="panel">
        <h2>Skill focus</h2>
        <div class="field"><label for="s0">Practise:</label><input id="s0" data-k="skill.0"></div>
        <div class="field"><label for="s1">Make / finish:</label><input id="s1" data-k="skill.1"></div>
        <div class="field"><label for="s2">Minimum:</label><input id="s2" data-k="skill.2"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const ROWS=["Early morning","Morning","Afternoon","Later evening"];
const ROW_HOURS=[[6,9],[9,12],[13,17],[18,21]]; // default calendar times for blocks without a time
const PROJECT_LABELS=["Outcome","Next step","Next step"], SKILL_LABELS=["Practise","Make / finish","Minimum"];
const KEY="weekly-planner-v1", THEME_KEY="weekly-planner-theme";
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const mondayOf=d=>{const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(r,-((r.getDay()+6)%7))};
const dayDate=i=>addDays(fromIso(state.weekStart),i);
const fmt=(d,o)=>d.toLocaleDateString(undefined,o);
const weekTitle=()=>fmt(dayDate(0),{day:"numeric",month:"short"})+" – "+fmt(dayDate(6),{day:"numeric",month:"short",year:"numeric"});

const DEFAULT={
  weekStart:"",
  library:[
    {id:"l1",label:"Gym",k:1},{id:"l2",label:"Deep work",k:2},{id:"l3",label:"Clients",k:2},
    {id:"l4",label:"Admin",k:6},{id:"l5",label:"Podcast",k:4},{id:"l6",label:"Family",k:3},
    {id:"l7",label:"Rest",k:5}
  ],
  cells:{"3-4":[{id:"b1",label:"Gym",k:1,time:"",anchor:true}]},
  projects:["","",""],
  skill:["","",""],
  habits:[
    {name:"Maintain 1",days:[0,0,0,0,0,0,0]},
    {name:"Maintain 2",days:[0,0,0,0,0,0,0]},
    {name:"Grow 1",days:[0,0,0,0,0,0,0]}
  ],
  makerTypes:["deep work"],
  makerTarget:8,
  routines:[ // one transition routine per section, same order as ROWS
    {name:"Wake-up reset",mins:10,steps:["Glass of water","Make the bed","Glance at today's plan"]},
    {name:"Focus startup",mins:5,steps:["Clear the desk","Close email and chat","Write the one outcome for this block"]},
    {name:"Midday reset",mins:10,steps:["Step outside or stretch","Capture loose ends","Re-read the afternoon plan"]},
    {name:"Shutdown ritual",mins:15,steps:["Get inbox and notes to zero","Plan tomorrow's first block","Say “shutdown complete”"]}
  ]
};
const SLOTS=ROWS.length*DAYS.length;
const TRANS="__transition"; // tray id for the transition chip
const isT=b=>b.type==="t";
const rowOf=cellKey=>+cellKey.split("-")[0];
const routineFor=cellKey=>state.routines[rowOf(cellKey)];
const newTransition=()=>({id:uid(),type:"t",done:[]});
const LOOP='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8.5A5.2 5.2 0 1 1 11.7 4.3M12.2 1.8v2.9H9.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tkey=label=>String(label).trim().toLowerCase(); // blocks with the same name count as one type
const isMaker=label=>state.makerTypes.includes(tkey(label));

/* fills in missing fields so older saves and imported backups always render */
function normalize(s){
  if(!s||typeof s!=="object"||Array.isArray(s))return null;
  const o=Object.assign(structuredClone(DEFAULT),s);
  const k=v=>v>=1&&v<=6?Math.floor(v):6;
  if(!Array.isArray(o.library))o.library=structuredClone(DEFAULT.library);
  o.library=o.library.filter(l=>l&&typeof l==="object").map(l=>({id:String(l.id||uid()),label:String(l.label||"Block"),k:k(l.k)}));
  if(!o.cells||typeof o.cells!=="object"||Array.isArray(o.cells))o.cells={};
  const cells={};
  Object.entries(o.cells).forEach(([key,arr])=>{
    if(!/^[0-3]-[0-6]$/.test(key)||!Array.isArray(arr))return;
    const a=arr.filter(b=>b&&typeof b==="object").map(b=>b.type==="t"
      ?{id:String(b.id||uid()),type:"t",done:Array.isArray(b.done)?b.done.filter(v=>typeof v==="string"):[]}
      :{id:String(b.id||uid()),label:String(b.label||"Block"),k:k(b.k),time:String(b.time||""),anchor:!!b.anchor});
    if(a.length)cells[key]=a;
  });
  o.cells=cells;
  ["projects","skill"].forEach(f=>{o[f]=[0,1,2].map(i=>Array.isArray(o[f])?String(o[f][i]||""):"")});
  if(!Array.isArray(o.habits))o.habits=structuredClone(DEFAULT.habits);
  o.habits=o.habits.filter(h=>h&&typeof h==="object").map(h=>({name:String(h.name||""),days:[0,1,2,3,4,5,6].map(i=>Array.isArray(h.days)&&h.days[i]?1:0)}));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.weekStart||""))o.weekStart=iso(mondayOf(new Date()));
  if(!Array.isArray(o.makerTypes))o.makerTypes=[...DEFAULT.makerTypes];
  o.makerTypes=[...new Set(o.makerTypes.filter(v=>typeof v==="string").map(tkey).filter(Boolean))];
  o.makerTarget=Number.isFinite(+o.makerTarget)?Math.max(0,Math.min(SLOTS,Math.round(+o.makerTarget))):DEFAULT.makerTarget;
  o.routines=ROWS.map((_,i)=>{
    const d=DEFAULT.routines[i],r=Array.isArray(o.routines)&&o.routines[i]&&typeof o.routines[i]==="object"?o.routines[i]:d;
    return {name:String(r.name??d.name),mins:Number.isFinite(+r.mins)?Math.max(0,Math.min(240,Math.round(+r.mins))):d.mins,
      steps:Array.isArray(r.steps)?r.steps.map(String):[...d.steps]};
  });
  delete o.week;
  return o;
}

let state=normalize(load())||normalize({});
let pickK=1, armed=null, dragEndAt=0;
const openT=new Set(); // transitions whose checklist is expanded (view state only)
let db=null, docRef=null, saveTimer=null, downloads=null;
const hist=[];

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(docRef){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      docRef.set({json:JSON.stringify(state)}).then(()=>flash("Saved")).catch(()=>{});
    },600);
  }
}
function flash(t,ms){const s=document.getElementById("status");s.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>s.textContent="",ms||1800)}

/* ---------- undo ---------- */
function snap(){hist.push(JSON.stringify(state));if(hist.length>50)hist.shift();undoBtn.disabled=false}
function undo(){
  if(!hist.length)return;
  state=JSON.parse(hist.pop());undoBtn.disabled=!hist.length;
  save();renderAll();flash("Undone");
}
const undoBtn=document.getElementById("undoBtn");
undoBtn.addEventListener("click",undo);

/* ---------- render ---------- */
const grid=document.getElementById("grid");
function renderGrid(){
  grid.innerHTML="";
  const today=iso(new Date());
  grid.appendChild(el("div","h","Time"));
  DAYS.forEach((d,i)=>{
    const dt=dayDate(i),h=el("div","h"+(iso(dt)===today?" today":""));
    h.append(el("span","",d.toUpperCase()),el("small","",fmt(dt,{day:"numeric",month:"short"})));
    grid.appendChild(h);
  });
  ROWS.forEach((r,ri)=>{
    grid.appendChild(el("div","rowh",r));
    DAYS.forEach((d,di)=>{
      const key=ri+"-"+di,c=el("div","cell");
      c.dataset.drop=key;
      c.setAttribute("aria-label",DAY_NAMES[di]+" "+r);
      (state.cells[key]||[]).forEach((b,i)=>{
        if(needsTransition(key,i))c.appendChild(gapAdd(key,i));
        c.appendChild(isT(b)?transEl(b,key):blockEl(b,key));
      });
      c.addEventListener("click",e=>{if(armed&&!e.target.closest("input,button,label,[contenteditable=true],.tr-head"))placeArmed(key,dropIndex(c,e.clientY))});
      c.addEventListener("keydown",e=>{
        if(armed&&e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();placeArmed(key);grid.querySelector('[data-drop="'+key+'"]').focus()}
      });
      grid.appendChild(c);
    });
  });
  applyPlacing();
  renderInsights();
}
/* a "+" slot is offered between two blocks, and at the top of a section when the section above it that day has blocks */
function needsTransition(key,i){
  const items=state.cells[key]||[];
  if(!items[i]||isT(items[i]))return false;
  if(i>0)return !isT(items[i-1]);
  const [ri,di]=key.split("-").map(Number);
  return ri>0&&(state.cells[(ri-1)+"-"+di]||[]).some(b=>!isT(b));
}
function gapAdd(key,i){
  const r=routineFor(key),b=el("button","gap-add");
  b.innerHTML=LOOP;b.append(document.createTextNode(r.name||"Transition"));
  b.setAttribute("aria-label","Add "+(r.name||"transition")+" here");
  b.title=i?"Add a transition between these blocks":"Add a transition into "+ROWS[rowOf(key)].toLowerCase();
  b.addEventListener("click",()=>{snap();insertAt(key,i,newTransition());save();renderGrid()});
  return b;
}
function transEl(b,key){
  const r=routineFor(key),open=openT.has(b.id);
  const d=el("div","item trans");d.dataset.bid=b.id;
  const head=el("div","tr-head");head.tabIndex=0;head.setAttribute("role","button");head.setAttribute("aria-expanded",open);
  head.innerHTML=LOOP;
  const tm=el("span","tm");
  head.append(el("span","tn",r.name||"Transition"),tm);
  const paint=()=>{
    const steps=r.steps.filter(s=>s.trim()),done=steps.filter(s=>b.done.includes(s)).length;
    tm.textContent=[steps.length?done+"/"+steps.length:"",r.mins?r.mins+" min":""].filter(Boolean).join(" · ");
    d.classList.toggle("done",!!steps.length&&done===steps.length);
    head.title=(steps.length?steps.join(" → "):"No steps yet — design it under Transition routines")+"\nClick to open the checklist · drag to move";
  };
  paint();
  const toggle=()=>{open?openT.delete(b.id):openT.add(b.id);renderGrid();grid.querySelector('[data-bid="'+b.id+'"] .tr-head')?.focus()};
  head.addEventListener("click",()=>{if(Date.now()-dragEndAt>350)toggle()});
  head.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  d.appendChild(head);
  if(open){
    const ul=el("ul"),steps=r.steps.filter(s=>s.trim());
    if(!steps.length)ul.appendChild(el("li","","No steps yet — add them under Transition routines"));
    steps.forEach(s=>{
      const li=el("li"),lab=el("label"),cb=document.createElement("input");
      cb.type="checkbox";cb.checked=b.done.includes(s);
      cb.addEventListener("change",()=>{b.done=cb.checked?[...b.done,s]:b.done.filter(v=>v!==s);save();paint()});
      lab.append(cb,document.createTextNode(s));li.appendChild(lab);ul.appendChild(li);
    });
    d.appendChild(ul);
  }
  const del=el("button","del","×");del.setAttribute("aria-label","Remove transition");
  del.addEventListener("click",()=>{snap();removeBlock(key,b.id);openT.delete(b.id);save();renderGrid()});
  d.appendChild(del);
  makeDraggable(d,{type:"block",cell:key,id:b.id});
  return d;
}
function blockEl(b,cellKey){
  const d=el("div","item block k"+b.k+(b.anchor?" anchor":""));
  d.dataset.bid=b.id; d.dataset.from=cellKey;
  d.title="Drag to move or reorder · Alt-drag to copy · drop on Blocks to remove";
  const t=el("span","t",b.label);
  t.title="Double-click to rename";
  t.addEventListener("dblclick",()=>{t.contentEditable="true";t.focus();document.getSelection().selectAllChildren(t)});
  t.addEventListener("blur",()=>{
    t.contentEditable="false";const v=t.textContent.trim();
    if(v&&v!==b.label){snap();b.label=v;save();renderGrid();return}
    t.textContent=b.label;
  });
  t.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();t.blur()}});
  const s=el("div","s");
  const pin=el("button","pin",b.anchor?"Weekly anchor":"Make anchor");
  pin.title="Anchors stay when you start a new week";
  pin.addEventListener("click",()=>{snap();b.anchor=!b.anchor;save();renderGrid()});
  const tl=el("span","","Time:");
  const ti=document.createElement("input");ti.value=b.time||"";ti.placeholder="e.g. 7am";ti.setAttribute("aria-label","Time");
  ti.addEventListener("input",()=>{b.time=ti.value;save()});
  s.append(tl,ti);
  const s2=el("div","s");s2.appendChild(pin);
  if(isMaker(b.label))s2.appendChild(el("span","tag","Maker"));
  const del=el("button","del","×");del.setAttribute("aria-label","Remove "+b.label);
  del.addEventListener("click",()=>{snap();removeBlock(cellKey,b.id);save();renderGrid()});
  d.append(t,s,s2,del);
  makeDraggable(d,{type:"block",cell:cellKey,id:b.id});
  return d;
}
function renderTray(){
  const box=document.getElementById("chips");box.innerHTML="";
  const armable=(c,id)=>{
    c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-pressed",armed===id);c.dataset.arm=id;
    c.addEventListener("click",e=>{if(e.target.closest(".x")||Date.now()-dragEndAt<350)return;setArmed(armed===id?null:id)});
    c.addEventListener("keydown",e=>{if(e.target===c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();setArmed(armed===id?null:id);[...box.children].find(n=>n.dataset.arm===id)?.focus()}});
  };
  const tc=el("div","chip tchip");tc.innerHTML=LOOP;tc.append(document.createTextNode("Transition"));
  tc.title="Drag between blocks (or tap, then tap a spot) — uses that section's routine";
  armable(tc,TRANS);makeDraggable(tc,{type:"trans"});box.appendChild(tc);
  state.library.forEach(l=>{
    const c=el("div","chip k"+l.k,"");
    c.append(document.createTextNode(l.label));
    const x=el("button","x","×");x.setAttribute("aria-label","Delete "+l.label+" from blocks");
    x.addEventListener("click",()=>{snap();state.library=state.library.filter(v=>v.id!==l.id);if(armed===l.id)armed=null;save();renderTray();applyPlacing()});
    c.appendChild(x);
    c.title="Drag onto the week, or tap then tap a slot";
    armable(c,l.id);makeDraggable(c,{type:"lib",id:l.id});
    box.appendChild(c);
  });
  const sw=document.getElementById("swatches");sw.innerHTML="";
  for(let k=1;k<=6;k++){
    const b=el("button","sw k"+k);b.setAttribute("aria-label","Colour "+k);
    b.setAttribute("aria-pressed",k===pickK);
    b.addEventListener("click",()=>{pickK=k;renderTray()});
    sw.appendChild(b);
  }
}
/* counts cells (not blocks) per type: a cell holding two Deep work blocks is one Deep work cell */
function weekStats(){
  const types=new Map();
  const typeOf=(label,k)=>{const key=tkey(label);if(!types.has(key))types.set(key,{key,label:label.trim(),k,cells:0});return types.get(key)};
  state.library.forEach(l=>typeOf(l.label,l.k));
  let used=0,maker=0,anchors=0,trans=0,transMins=0;const map={},transByRow=ROWS.map(()=>0);
  Object.entries(state.cells).forEach(([ck,items])=>{
    const arr=items.filter(b=>!isT(b)),t=items.length-arr.length;
    trans+=t;transMins+=t*state.routines[rowOf(ck)].mins;transByRow[rowOf(ck)]+=t;
    if(!arr.length)return;
    used++;anchors+=arr.filter(b=>b.anchor).length;
    const keys=new Set(arr.map(b=>typeOf(b.label,b.k).key));
    keys.forEach(k=>types.get(k).cells++);
    const mk=[...keys].some(k=>state.makerTypes.includes(k));
    if(mk)maker++;
    map[ck]=mk?"mk":"used";
  });
  const list=[...types.values()].sort((a,b)=>b.cells-a.cells||a.label.localeCompare(b.label));
  return {types:list,used,maker,anchors,map,trans,transMins,transByRow};
}
function renderInsights(){
  const st=weekStats(),target=state.makerTarget;
  /* maker time */
  document.getElementById("tVal").textContent=target;
  document.getElementById("tDown").disabled=target<=0;
  document.getElementById("tUp").disabled=target>=SLOTS;
  document.getElementById("mCount").textContent=st.maker;
  document.getElementById("mOf").textContent=target?"/ "+target+" cells":(st.maker===1?"cell":"cells");
  const msg=document.getElementById("mMsg");
  msg.className="maker-msg"+(target&&st.maker>=target?" met":"");
  msg.textContent=!target?"No target set":st.maker<target?(target-st.maker)+" to go":st.maker===target?"Target met":"Target met · "+(st.maker-target)+" over";
  const segs=document.getElementById("segs");segs.innerHTML="";
  for(let i=0;i<Math.max(target,st.maker);i++)segs.appendChild(el("span","seg"+(i<st.maker?(i<target||!target?" on":" over"):"")));
  const mini=document.getElementById("mini");mini.innerHTML="";
  mini.appendChild(el("span",""));
  DAYS.forEach(d=>mini.appendChild(el("span","dl",d[0])));
  ["Early","Morning","Afternoon","Evening"].forEach((r,ri)=>{
    mini.appendChild(el("span","",r));
    DAYS.forEach((_,di)=>{const i=el("i",st.map[ri+"-"+di]||"");i.title=DAY_NAMES[di]+" "+ROWS[ri];mini.appendChild(i)});
  });
  /* breakdown */
  document.getElementById("usedNote").textContent=st.used+" of "+SLOTS+" slots used"+(st.anchors?" · "+st.anchors+" anchor"+(st.anchors===1?"":"s"):"")
    +(st.trans?" · "+st.trans+" transition"+(st.trans===1?"":"s")+(st.transMins?" ("+fmtMins(st.transMins)+")":""):"");
  document.querySelectorAll("#rgrid .rused").forEach((s,ri)=>s.textContent=st.transByRow[ri]?"Used "+st.transByRow[ri]+"× this week":"Not used this week");
  const rows=document.getElementById("brows");rows.innerHTML="";
  const max=Math.max(1,...st.types.map(t=>t.cells));
  st.types.forEach(t=>{
    const on=state.makerTypes.includes(t.key);
    const tg=el("button","mk-toggle","Maker");tg.setAttribute("aria-pressed",on);tg.dataset.key=t.key;
    tg.title=on?"Counts toward maker time — click to stop counting it":"Count "+t.label+" as maker time";
    tg.setAttribute("aria-label","Count "+t.label+" as maker time");
    tg.addEventListener("click",()=>{
      state.makerTypes=on?state.makerTypes.filter(k=>k!==t.key):[...state.makerTypes,t.key];
      save();renderGrid();
      [...rows.querySelectorAll(".mk-toggle")].find(b=>b.dataset.key===t.key)?.focus();
    });
    const track=el("div","track"),fill=el("div","fill");
    fill.style.width=(t.cells/max*100)+"%";fill.style.color="var(--c"+t.k+"i)";track.appendChild(fill);
    rows.append(tg,el("span","btype k"+t.k,t.label),track,el("span","bcount"+(t.cells?"":" zero"),t.cells));
  });
}
const fmtMins=m=>m<60?m+" min":Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":"");

/* ---------- transition routine designer ---------- */
function renderRoutines(){
  const g=document.getElementById("rgrid");g.innerHTML="";
  state.routines.forEach((r,ri)=>{
    const card=el("div","rcard");
    card.appendChild(el("div","rsec",ROWS[ri]));
    const name=document.createElement("input");name.className="rname";name.value=r.name;name.placeholder="Name this routine";
    name.setAttribute("aria-label",ROWS[ri]+" transition name");
    name.addEventListener("input",()=>{r.name=name.value;save();renderGrid()});
    const mins=el("label","rmins","Takes "),mi=document.createElement("input");
    mi.type="number";mi.min=0;mi.max=240;mi.step=5;mi.value=r.mins;mi.setAttribute("aria-label",ROWS[ri]+" transition minutes");
    mi.addEventListener("input",()=>{r.mins=Math.max(0,Math.min(240,Math.round(+mi.value)||0));save();renderGrid()});
    mins.append(mi,document.createTextNode("min"));
    const ul=el("ul","rsteps");
    r.steps.forEach((s,si)=>{

/* ---------- state ops ---------- */
function removeBlock(cell,id){
  const arr=state.cells[cell]||[];const i=arr.findIndex(b=>b.id===id);
  if(i<0)return null;const [b]=arr.splice(i,1);if(!arr.length)delete state.cells[cell];return b;
}
function insertAt(cell,index,item){
  const arr=state.cells[cell]=state.cells[cell]||[];
  arr.splice(index==null?arr.length:Math.max(0,Math.min(index,arr.length)),0,item);
}
function addFromLibrary(libId,cell,index){
  if(libId===TRANS){insertAt(cell,index,newTransition());return true}
  const l=state.library.find(v=>v.id===libId);if(!l)return false;
  insertAt(cell,index,{id:uid(),label:l.label,k:l.k,time:"",anchor:false});
  return true;
}
/* where in a cell's list a drop at height y lands, ignoring the item being dragged */
function dropIndex(cellEl,y,skipId){
  let i=0;
  for(const n of cellEl.querySelectorAll(":scope>.item")){
    if(n.dataset.bid===skipId)continue;
    const r=n.getBoundingClientRect();if(y<r.top+r.height/2)return i;i++;
  }
  return i;
}
function drop(src,target,copy,index){
  if(!target)return;
  if(target==="tray"){ if(src.type!=="block")return; snap();removeBlock(src.cell,src.id) }
  else if(src.type==="lib"||src.type==="trans"){ snap();if(!addFromLibrary(src.type==="trans"?TRANS:src.id,target,index)){hist.pop();return} }
  else if(src.type==="block"){
    const arr=state.cells[src.cell]||[],b=arr.find(v=>v.id===src.id);
    if(!b)return;
    if(copy){snap();insertAt(target,index,isT(b)?newTransition():{...b,id:uid(),anchor:false})}
    else{
      if(src.cell===target&&index===arr.indexOf(b))return;
      snap();removeBlock(src.cell,src.id);insertAt(target,index,b);
    }
  }
  save();renderGrid();
}

/* ---------- pointer drag (mouse + touch) ---------- */
let drag=null;
const dropLine=el("div","drop-line");
function showDropLine(cellEl,index,skipId){
  const items=[...cellEl.querySelectorAll(":scope>.item")].filter(n=>n.dataset.bid!==skipId);
  const ref=items[index];
  cellEl.insertBefore(dropLine,ref?(ref.previousElementSibling&&ref.previousElementSibling.classList.contains("gap-add")?ref.previousElementSibling:ref):null);
}
/* moves are tracked on the document (no pointer capture), so a drag that starts near an
   item's edge still registers and plain clicks keep reaching the element under the pointer */
function makeDraggable(node,src){
  node.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    if(e.target.closest("input,button,label,[contenteditable=true]"))return;
    drag={node,src,x:e.clientX,y:e.clientY,started:false,ghost:null,over:null};
  });
}
function endDrag(e,commit){
  const d=drag;drag=null;
  if(!d||!d.started)return;
  dragEndAt=Date.now();
  d.ghost.remove();d.node.classList.remove("dragging-src");dropLine.remove();
  document.getElementById("tray").classList.remove("drop-bin");
  if(!d.over)return;
  d.over.classList.remove("over");
  if(!commit)return;
  const skip=d.src.type==="block"&&!e.altKey?d.src.id:null;
  drop(d.src,d.over.dataset.drop,e.altKey,d.over.dataset.drop!=="tray"?dropIndex(d.over,e.clientY,skip):null);
}
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(e.pointerType==="mouse"&&!e.buttons){endDrag(e,false);return} // button released outside the window
  const {node,src}=drag;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
    drag.started=true;
    const r=node.getBoundingClientRect();
    drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
    const g=node.cloneNode(true);g.classList.add("ghost");g.style.width=r.width+"px";
    document.body.appendChild(g);drag.ghost=g;
    if(src.type==="block"){node.classList.add("dragging-src");document.getElementById("tray").classList.add("drop-bin")}
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+"px";
  drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  drag.ghost.classList.toggle("copy",src.type==="block"&&e.altKey);
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const z=t&&t.closest("[data-drop]");
  const valid=z&&(z.dataset.drop!=="tray"||src.type==="block")?z:null;
  if(drag.over&&drag.over!==valid)drag.over.classList.remove("over");
  if(valid&&valid.classList.contains("cell")){
    valid.classList.add("over");
    const skip=src.type==="block"&&!e.altKey?src.id:null;
    showDropLine(valid,dropIndex(valid,e.clientY,skip),skip);
  }else dropLine.remove();
  drag.over=valid;
});
document.addEventListener("pointerup",e=>endDrag(e,true));

function toCsv(){
  const q=v=>{v=String(v);if(/^[=+@]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["Date","Day","Time of day","Block","Time","Anchor","Maker time"]];
  blocksInOrder().forEach(({di,ri,b})=>{
    const t=state.routines[ri];
    rows.push(isT(b)?[iso(dayDate(di)),DAY_NAMES[di],ROWS[ri],"Transition: "+(t.name||"Transition"),t.mins?t.mins+" min":"","",""]
      :[iso(dayDate(di)),DAY_NAMES[di],ROWS[ri],b.label,b.time,b.anchor?"yes":"",isMaker(b.label)?"yes":""]);
  });
  return "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")+"\r\n";
}

/* reads times like "7", "7:30", "7am", "19:00", "9-10:30", "7–8pm"; returns minutes from midnight */
function parseTime(str,ri){
  const m=String(str||"").toLowerCase().replace(/\s+/g,"")
    .match(/^(\d{1,2})(?:[:.h](\d{2}))?(am|pm|a|p)?(?:(?:-|–|—|to|until)(\d{1,2})(?:[:.h](\d{2}))?(am|pm|a|p)?)?$/);
  if(!m)return null;
  const h1=+m[1],m1=+(m[2]||0),h2=m[4]!=null?+m[4]:null,m2=+(m[5]||0);
  let a1=m[3]&&m[3][0],a2=m[6]&&m[6][0];
  if(!a1&&a2)a1=a2==="p"&&h1%12>h2%12?"a":a2;
  if(a1&&!a2&&h2!=null)a2=a1==="a"&&h2%12<h1%12?"p":a1;
  const to24=(h,a)=>{
    if(a==="p")return h%12+12;
    if(a==="a")return h%12;
    if((ri===2&&h>=1&&h<=8)||(ri===3&&h>=1&&h<12))return h+12; // afternoon/evening without am/pm
    return h;
  };
  const H1=to24(h1,a1);if(H1>23||m1>59)return null;
  const s=H1*60+m1;let e=s+60;
  if(h2!=null){
    const H2=to24(h2,a2);if(H2>24||m2>59)return null;
    e=H2*60+m2;
    if(e<=s)e=(!a2&&e+720>s)?e+720:s+60;
  }
  return {s,e};
}
function toIcs(){
  const esc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const enc=new TextEncoder();
  const fold=line=>{let out="",cur="",n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>(out?74:75)){out+=cur+"\r\n ";cur="";n=0}cur+=ch;n+=b}return out+cur};
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const local=(di,mins)=>{const d=dayDate(di);d.setMinutes(mins);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"};
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Weekly planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Weekly planner"];
  const ev=(b,di,t,summary,desc)=>L.push("BEGIN:VEVENT","UID:"+b.id+"-"+state.weekStart+"@weekly-planner","DTSTAMP:"+stamp,
    "DTSTART:"+local(di,t.s),"DTEND:"+local(di,t.e),"SUMMARY:"+esc(summary),"DESCRIPTION:"+esc(desc),"END:VEVENT");
  blocksInOrder().forEach(({di,ri,b})=>{
    if(isT(b))return;
    const t=parseTime(b.time,ri)||{s:ROW_HOURS[ri][0]*60,e:ROW_HOURS[ri][1]*60};
    ev(b,di,t,b.label,ROWS[ri]+(b.time?" · "+b.time:"")+(b.anchor?" · weekly anchor":""));
  });
  // transitions only get a time when they sit next to a block with an explicit time
  Object.entries(state.cells).forEach(([key,items])=>{
    const [ri,di]=key.split("-").map(Number),r=state.routines[ri],len=r.mins||10;
    items.forEach((b,i)=>{
      if(!isT(b))return;
      const prev=items[i-1]&&!isT(items[i-1])&&parseTime(items[i-1].time,ri);
      const next=items[i+1]&&!isT(items[i+1])&&parseTime(items[i+1].time,ri);
      const t=prev?{s:prev.e,e:prev.e+len}:next?{s:next.s-len,e:next.s}:null;
      if(t)ev(b,di,t,"↻ "+(r.name||"Transition"),r.steps.filter(s=>s.trim()).map((s,j)=>(j+1)+". "+s).join("\n"));
    });
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n";
}

  ics(){if(!blocksInOrder().some(x=>!isT(x.b)))return flash("Nothing to export yet");saveFile(fileBase()+".ics",toIcs(),"text/calendar")},
  csv(){saveFile(fileBase()+".csv",toCsv(),"text/csv")},
  md(){saveFile(fileBase()+".md",toMarkdown(),"text/markdown")},
  copy(){copyText(toMarkdown())},
  json(){saveFile(fileBase()+"-backup.json",JSON.stringify({app:"weekly-planner",version:2,exported:new Date().toISOString(),state},null,2),"application/json")},
  import(){document.getElementById("importFile").click()}
};
document.getElementById("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const raw=JSON.parse(await f.text()),s=raw&&raw.state?raw.state:raw;
    if(!s||typeof s!=="object"||!(s.cells||s.library))throw 0;
    snap();state=normalize(s);save();renderAll();flash("Backup restored",2500);
  }catch(err){flash("That file isn't a planner backup",3000)}
});

renderAll();

/* ---------- sync across devices when available ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id();if(!id)return;
    db=d;docRef=db.doc("data/users/"+id+"/planner");
    const snap=await docRef.get();
    if(snap.exists){
      const j=snap.data().json;
      const s=typeof j==="string"&&normalize(JSON.parse(j));
      if(s){state=s;hist.length=0;undoBtn.disabled=true;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}renderAll()}
    }else{save()}
  }catch(e){}
})();
/* file saving through the host when this page runs as a Claude artifact */
(async()=>{try{if(window.claude&&window.claude.use)downloads=await claude.use("downloads")}catch(e){}})();
})();
</script>
</body>
